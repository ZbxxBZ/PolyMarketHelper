{% extends "base.html" %}

{% block title %}系统日志{% endblock %}

{% block content %}
<div class="page-header">
    <h1>系统日志</h1>
    <div class="header-actions">
        <button class="btn" onclick="refreshLogs()">刷新</button>
        <button class="btn-secondary" onclick="toggleAutoRefresh()" id="auto-refresh-btn">暂停自动刷新</button>
        <button class="btn-secondary" onclick="clearLogs()">清空内存日志</button>
    </div>
</div>

<div class="log-filters">
    <label>
        <input type="checkbox" id="filter-info" checked onchange="filterLogs()"> INFO
    </label>
    <label>
        <input type="checkbox" id="filter-warning" checked onchange="filterLogs()"> WARNING
    </label>
    <label>
        <input type="checkbox" id="filter-error" checked onchange="filterLogs()"> ERROR
    </label>
    <label style="margin-left:auto;">
        刷新间隔:
        <select id="refresh-interval" onchange="changeRefreshInterval()">
            <option value="2000">2 秒</option>
            <option value="5000" selected>5 秒</option>
            <option value="10000">10 秒</option>
            <option value="30000">30 秒</option>
            <option value="0">关闭</option>
        </select>
    </label>
</div>

<div class="log-container" id="log-container">
    <div class="loading">加载中...</div>
</div>

<div class="card" style="margin-top:20px;">
    <h2>日志文件下载</h2>
    <p style="color:#8b949e;font-size:13px;margin-bottom:12px;">
        文件存放路径：<code>data/logs/</code>。按设置的轮转周期自动切分，超过保留份数的旧文件会被删除。
    </p>
    <div id="log-files-list" class="log-files-list">
        <div class="loading">加载中...</div>
    </div>
</div>

<style>
.header-actions {
    display: flex;
    gap: 10px;
}

.log-filters {
    margin-bottom: 15px;
    padding: 10px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
}

.log-filters label {
    margin-right: 20px;
    cursor: pointer;
    color: #c9d1d9;
}

.log-filters input[type="checkbox"] {
    margin-right: 5px;
}

.log-container {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 15px;
    max-height: 600px;
    overflow-y: auto;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 13px;
}

.log-entry {
    padding: 8px;
    margin-bottom: 5px;
    border-left: 3px solid #30363d;
    background: #161b22;
}

.log-message {
    color: #c9d1d9;
    white-space: pre-wrap;
    word-break: break-word;
    display: block;
    margin-top: 4px;
    font-family: 'Consolas', 'Monaco', monospace;
}

.log-entry.info {
    border-left-color: #58a6ff;
}

.log-entry.warning {
    border-left-color: #d29922;
}

.log-entry.error {
    border-left-color: #f85149;
}

.log-time {
    color: #8b949e;
    margin-right: 10px;
}

.log-level {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: bold;
    margin-right: 10px;
}

.log-level.info {
    background: #1f6feb;
    color: white;
}

.log-level.warning {
    background: #9e6a03;
    color: white;
}

.log-level.error {
    background: #da3633;
    color: white;
}

.loading {
    text-align: center;
    color: #8b949e;
    padding: 20px;
}

.btn-secondary {
    padding: 8px 16px;
    background: #21262d;
    color: #c9d1d9;
    border: 1px solid #30363d;
    border-radius: 6px;
    cursor: pointer;
}

.btn-secondary:hover {
    background: #30363d;
}

.log-files-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.log-file-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    font-size: 13px;
}

.log-file-row .name { flex: 1; font-family: 'Consolas', 'Monaco', monospace; color: #c9d1d9; word-break: break-all; }
.log-file-row .meta { color: #8b949e; white-space: nowrap; }
.log-file-row a { color: #58a6ff; text-decoration: none; padding: 4px 10px; border: 1px solid #30363d; border-radius: 4px; }
.log-file-row a:hover { background: #21262d; }
</style>

<script>
let autoRefresh = null;
let refreshMs = 5000;

document.addEventListener('DOMContentLoaded', () => {
    refreshLogs();
    refreshLogFiles();
    startAutoRefresh();
});

function startAutoRefresh() {
    if (autoRefresh) clearInterval(autoRefresh);
    if (refreshMs > 0) {
        autoRefresh = setInterval(() => { refreshLogs(); refreshLogFiles(); }, refreshMs);
    }
    const btn = document.getElementById('auto-refresh-btn');
    if (btn) btn.textContent = refreshMs > 0 ? '暂停自动刷新' : '恢复自动刷新';
}

function toggleAutoRefresh() {
    if (autoRefresh) {
        clearInterval(autoRefresh);
        autoRefresh = null;
        document.getElementById('auto-refresh-btn').textContent = '恢复自动刷新';
    } else {
        startAutoRefresh();
    }
}

function changeRefreshInterval() {
    refreshMs = parseInt(document.getElementById('refresh-interval').value, 10) || 0;
    startAutoRefresh();
}

function refreshLogs() {
    fetch('/api/system-logs')
        .then(r => r.json())
        .then(data => {
            const container = document.getElementById('log-container');
            if (data.logs && data.logs.length > 0) {
                container.innerHTML = data.logs.map(log => `
                    <div class="log-entry ${log.level}" data-level="${log.level}">
                        <span class="log-time">${log.time}</span>
                        <span class="log-level ${log.level}">${log.level.toUpperCase()}</span>
                        <span class="log-message">${escapeHtml(log.message)}</span>
                    </div>
                `).join('');
                container.scrollTop = container.scrollHeight;
            } else {
                container.innerHTML = '<div class="loading">暂无日志</div>';
            }
            filterLogs();
        })
        .catch(err => {
            console.error('加载日志失败:', err);
            document.getElementById('log-container').innerHTML =
                '<div class="loading">加载失败</div>';
        });
}

function refreshLogFiles() {
    fetch('/api/log-files')
        .then(r => r.json())
        .then(data => {
            const list = document.getElementById('log-files-list');
            if (data.error) {
                list.innerHTML = `<div class="loading">加载失败: ${escapeHtml(data.error)}</div>`;
                return;
            }
            if (!data.files || data.files.length === 0) {
                list.innerHTML = '<div class="loading">暂无日志文件</div>';
                return;
            }
            list.innerHTML = data.files.map(f => `
                <div class="log-file-row">
                    <span class="name">${escapeHtml(f.name)}</span>
                    <span class="meta">${formatSize(f.size)}</span>
                    <span class="meta">${escapeHtml(f.mtime)}</span>
                    <a href="/api/log-files/${encodeURIComponent(f.name)}" download>下载</a>
                </div>
            `).join('');
        })
        .catch(err => {
            document.getElementById('log-files-list').innerHTML =
                `<div class="loading">网络错误: ${escapeHtml(String(err))}</div>`;
        });
}

function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(2) + ' MB';
}

function filterLogs() {
    const showInfo = document.getElementById('filter-info').checked;
    const showWarning = document.getElementById('filter-warning').checked;
    const showError = document.getElementById('filter-error').checked;

    document.querySelectorAll('.log-entry').forEach(entry => {
        const level = entry.dataset.level;
        const show = (level === 'info' && showInfo) ||
                     (level === 'warning' && showWarning) ||
                     (level === 'error' && showError);
        entry.style.display = show ? 'block' : 'none';
    });
}

function clearLogs() {
    if (!confirm('确定要清空所有系统日志吗？')) return;

    fetch('/api/system-logs/clear', { method: 'POST' })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                refreshLogs();
            } else {
                alert('清空失败');
            }
        });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
{% endblock %}
